<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>공부 체크인</title>
<style>
:root{
  --bg:#f8f6f2; --card:#fff; --ink:#242424; --muted:#666; --line:#e3d9cc;
  --accent:#5b4634; --soft:#efe6da; --good:#3f7450; --bad:#9a4444;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,sans-serif;color:var(--ink);line-height:1.58}
header{position:sticky;top:0;z-index:10;background:rgba(248,246,242,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 15px}
.head{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:19px;margin:0;color:var(--accent);letter-spacing:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.progress-box{min-width:130px}.progress-label{font-size:12px;color:var(--muted);text-align:right;margin-bottom:4px}.bar{height:8px;background:#e8dfd4;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--accent);transition:.2s}
main{max-width:760px;margin:0 auto;padding:17px 14px 88px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:13px 0;box-shadow:0 5px 22px rgba(0,0,0,.04)}
h2{font-size:25px;line-height:1.28;margin:0 0 10px;letter-spacing:0;color:#2e2925}p{margin:9px 0}.notice{background:var(--soft);border-radius:14px;padding:13px;color:#44362b;margin:12px 0}.quiet{font-size:13px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}label{font-weight:800;color:#4b3a2e;font-size:14px}input,select,textarea{width:100%;font-size:16px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:5px}textarea{min-height:96px;resize:vertical;line-height:1.5}.wide{grid-column:1/-1}
.check{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:12px;background:#fff}.check input{width:auto;margin:4px 0 0}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;color:var(--muted);font-size:13px}.pill{background:#f4efe8;border:1px solid #eadfD2;border-radius:999px;padding:4px 9px;color:#634b36;font-weight:800}
.q-text{font-size:22px;font-weight:900;line-height:1.43;margin:8px 0 13px;letter-spacing:0}.helper{background:#f8f5f0;border:1px solid #eee4d9;border-radius:13px;padding:10px 11px;color:#584838;font-size:14px;margin:9px 0 14px}
.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choice{border:1px solid var(--line);border-radius:15px;background:#fff;min-height:76px;padding:11px 7px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;cursor:pointer;font-size:13px;user-select:none}.choice strong{font-size:20px;margin-bottom:2px}.choice.selected{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:900;box-shadow:0 0 0 2px rgba(91,70,52,.08) inset}.choice.option{grid-column:1/-1;min-height:auto;align-items:flex-start;text-align:left;padding:13px 14px;font-size:15px}.choice-number{font-weight:900;color:var(--accent);margin-right:5px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(248,246,242,.98);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;justify-content:center}button{border:0;border-radius:999px;padding:13px 17px;font-size:16px;font-weight:900;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#ebe7e0;color:#333}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}
.done{border-left:5px solid var(--good);background:#f3faf4}.error{border-left:5px solid var(--bad);background:#fff3f3}.spinner{width:22px;height:22px;border:3px solid #e5d8c8;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){.head{display:block}.progress-box{margin-top:8px}.progress-label{text-align:left}.form-grid{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.choice{min-height:auto;align-items:flex-start;text-align:left;padding:12px 13px}.q-text{font-size:21px}.card{padding:18px}.nav button{flex:1}}
</style>
</head>
<body>
<header>
  <div class="head">
    <div><h1>공부 체크인</h1><div class="sub">나에게 맞는 공부 방법을 찾는 시간</div></div>
    <div class="progress-box"><div class="progress-label" id="progressLabel">시작 전</div><div class="bar"><span id="progressBar"></span></div></div>
  </div>
</header>
<main>
  <section id="intro" class="card">
    <h2>공부 체크인</h2>
    <p>이건 시험이 아닙니다. 정답을 맞히는 것도 아니고, 누가 더 잘하는지 비교하는 것도 아닙니다.</p>
    <div class="notice">최근 한 달 동안의 나와 가장 비슷한 모습을 골라주세요. 선생님은 이 답변을 보고 나에게 더 잘 맞는 공부 방법을 정리해줄 예정입니다.</div>
    <div class="form-grid">
      <label>학생 이름 <input id="studentName" autocomplete="name" placeholder="이름" /></label>
      <label>학년
        <select id="grade"><option value="">선택</option><option>초등</option><option>중등</option><option>고등</option></select>
      </label>
      <label class="wide">반 / 담당 선생님 <input id="teacherName" placeholder="예: 중2 화목 7시 / 담당 선생님" /></label>
    </div>
    <div class="check">
      <input id="consent" type="checkbox" />
      <label for="consent">이 체크인은 학생에게 맞는 학습 지도를 위해 사용되며, 응답은 학원 내부 학습 코칭 자료로만 확인합니다.</label>
    </div>
    <p class="quiet">제출 후에는 화면에 결과가 바로 나오지 않습니다. 선생님이 답변을 확인한 뒤 공부 리포트를 정리해줄 예정입니다.</p>
    <button class="primary" onclick="startCheckin()">시작하기</button>
  </section>
  <section id="questionCard" class="card hidden"></section>
  <section id="doneCard" class="card hidden"></section>
</main>
<div id="nav" class="nav hidden">
  <button class="secondary" onclick="prevStep()">이전</button>
  <button id="nextButton" class="primary" onclick="nextStep()">다음</button>
</div>
<script>
const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxxiCOQDDyanyGurcrth7uh_OihxHxZ33354eaH3pRjQhM2jqDhxFmow7Mjq7OoYq2-/exec';
const CHECKIN_DATA = {"preItems":[{"publicId":"S01","text":"나는 처음 보는 영어 내용도 차근차근 보면 따라갈 수 있는 편이다."},{"publicId":"S02","text":"영어 문제가 어려워도 바로 포기하기보다 조금 더 해보는 편이다."},{"publicId":"S03","text":"시험이나 숙제 결과가 좋지 않아도 다시 공부를 시작하는 편이다."},{"publicId":"S04","text":"틀린 문제나 지적받은 내용을 너무 오래 마음에 담아두지는 않는다."},{"publicId":"S05","text":"누가 말하지 않아도 해야 할 영어 공부를 시작하는 편이다."},{"publicId":"S06","text":"공부해야 할 것을 알면서도 자꾸 미루는 편은 아니다."},{"publicId":"S07","text":"점수도 중요하지만 내가 제대로 이해했는지도 중요하게 생각한다."},{"publicId":"S08","text":"친구와 비교하기보다 지난번의 나보다 나아졌는지를 보려고 한다."},{"publicId":"S09","text":"모르는 내용이 생기면 그냥 넘기지 않고 표시하거나 질문하는 편이다."},{"publicId":"S10","text":"시험이 끝난 뒤 틀린 문제를 다시 보는 편이다."}],"questions":[{"publicId":"Q001","type":"likert","text":"처음 보는 영어 내용도 차근차근 보면 이해할 수 있을 것 같다."},{"publicId":"Q002","type":"likert","text":"선생님 설명을 한 번에 못 알아들어도, 다시 들으면 이해할 수 있을 것 같다."},{"publicId":"Q003","type":"likert","text":"바로 답이 안 나와도 몇 분은 더 생각해 본다."},{"publicId":"Q004","type":"likert","text":"시험에서 처음 보는 문제가 나와도, 내가 아는 것부터 써 볼 수 있다."},{"publicId":"Q005","type":"likert","text":"선생님이 고쳐 준 부분을 보면, 다음에는 더 잘할 수 있을 것 같다."},{"publicId":"Q006","type":"likert","text":"틀린 문제를 보면 ‘나는 역시 못해’라는 생각이 먼저 든다."},{"publicId":"Q007","type":"likert","text":"어려운 문제가 나오면 ‘이건 나랑 안 맞아’ 하고 금방 마음을 접는다."},{"publicId":"Q008","type":"likert","text":"새 단원을 배울 때 무섭기만 하기보다 궁금한 마음도 있다."},{"publicId":"Q009","type":"likert","text":"친구보다 늦게 이해해도, 결국 따라갈 수 있을 것 같다."},{"publicId":"Q010","type":"likert","text":"질문하면 못해 보일까 봐 모르는 것을 그냥 넘길 때가 있다."},{"publicId":"Q011","type":"likert","text":"시험 전에 ‘공부한 만큼은 해낼 수 있다’고 느끼는 편이다."},{"publicId":"Q012","type":"likert","text":"틀렸던 문제를 다시 맞히면 ‘나도 할 수 있네’라는 느낌이 든다."},{"publicId":"Q013","type":"likert","text":"시험을 못 봐도 다음 공부를 다시 시작하는 편이다."},{"publicId":"Q014","type":"likert","text":"많이 틀린 날에는 그날 영어 공부를 더 하기 싫어진다."},{"publicId":"Q015","type":"likert","text":"선생님에게 고칠 점을 들으면, 그 말이 오래 남아 공부가 잘 안 된다."},{"publicId":"Q016","type":"likert","text":"문제가 어려워져도 끝까지 해보려는 편이다."},{"publicId":"Q017","type":"likert","text":"틀린 문제가 많아도 ","text":"이번 주 목표로 가장 해볼 만한 것은?","options":[{"t":"어려운 문제 앞에서 3분만 생각해보기"},{"t":"틀린 문제 옆에 고칠 점 하나 적기"},{"t":"공부 시작 전에 오늘 할 일 하나 정하기"},{"t":"공부가 끝난 뒤 오늘 해낸 것 하나 적기"}]}]};
const scaleLabels = ['나와 거의 다르다','조금 다르다','반반 / 잘 모르겠다','조금 비슷하다','나와 매우 비슷하다'];
const preScaleLabels = ['전혀 아니다','조금 아니다','반반이다','조금 그렇다','매우 그렇다'];
let steps = [];
let current = 0;
let answers = {};
let answerTimes = {};
let stepStart = 0;
let submitting = false;

function esc(s){return String(s||'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}
function setupSteps(){
  steps = [
    ...CHECKIN_DATA.preItems.map((item, i)=>({kind:'pre', index:i+1, ...item})),
    {kind:'free'},
    ...CHECKIN_DATA.questions.map((item, i)=>({kind:'main', index:i+1, ...item}))
  ];
}
function startCheckin(){
  const errors = [];
  if(!document.getElementById('studentName').value.trim()) errors.push('이름을 입력해 주세요.');
  if(!document.getElementById('grade').value) errors.push('학년을 선택해 주세요.');
  if(!document.getElementById('teacherName').value.trim()) errors.push('반 / 담당 선생님을 입력해 주세요.');
  if(!document.getElementById('consent').checked) errors.push('학습 코칭 활용 안내를 확인해 주세요.');
  if(GAS_WEB_APP_URL.includes('PASTE_')) errors.push('아직 제출 주소가 설정되지 않았습니다. 선생님에게 알려주세요.');
  if(errors.length){ alert(errors.join('\n')); return; }
  setupSteps();
  current = 0;
  answers = {};
  answerTimes = {};
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('questionCard').classList.remove('hidden');
  document.getElementById('nav').classList.remove('hidden');
  renderStep();
}
function renderStep(){
  const step = steps[current];
  stepStart = Date.now();
  const box = document.getElementById('questionCard');
  if(step.kind === 'free'){
    box.innerHTML = `<div class="q-top"><span class="pill">직접 적기</span><span>${current+1} / ${steps.length}</span></div>
      <div class="q-text">선생님이 내 공부를 더 잘 이해할 수 있게 적어주세요.</div>
      <label>내가 생각하는 내 영어 공부의 장점<textarea id="freeStrength">${esc(answers.freeStrength||'')}</textarea></label>
      <label>요즘 내가 고치고 싶은 공부 습관<textarea id="freeImprove">${esc(answers.freeImprove||'')}</textarea></label>
      <label>선생님이 내 공부를 도와줄 때 알아주면 좋은 점<textarea id="freeTeacherNote">${esc(answers.freeTeacherNote||'')}</textarea></label>`;
  } else {
    const labels = step.kind === 'pre' ? preScaleLabels : scaleLabels;
    const guide = step.type && step.type !== 'likert'
      ? '가장 좋아 보이는 답이 아니라, 실제 나와 가장 가까운 쪽을 골라 주세요.'
      : '떠오르는 한두 장면을 생각한 뒤, 실제 모습과 가장 가까운 번호를 골라 주세요.';
    let choices = '';
    if(!step.type || step.type === 'likert'){
      choices = labels.map((label, idx)=>choiceHTML(step.publicId, idx+1, `<strong>${idx+1}</strong><span>${esc(label)}</span>`, '')).join('');
    } else {
      choices = step.options.map((op, idx)=>choiceHTML(step.publicId, idx+1, `<span><span class="choice-number">${idx+1}.</span>${esc(op.t)}</span>`, ' option')).join('');
    }
    box.innerHTML = `<div class="q-top"><span class="pill">${step.kind==='pre'?'먼저 보기':'문항'} ${step.index}</span><span>${current+1} / ${steps.length}</span></div>
      <div class="q-text">${esc(step.text)}</div>
      <div class="helper">${guide}</div>
      <div class="choices">${choices}</div>`;
  }
  updateNav();
  updateProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}
function choiceHTML(id, value, inner, extraClass){
  const selected = answers[id] === value ? ' selected' : '';
  return `<div class="choice${extraClass}${selected}" onclick="selectAnswer('${id}', ${value})">${inner}</div>`;
}
function selectAnswer(id, value){
  answers[id] = value;
  answerTimes[id] = Date.now() - stepStart;
  renderStep();
}
function persistFree(){
  const s=document.getElementById('freeStrength'), i=document.getElementById('freeImprove'), t=document.getElementById('freeTeacherNote');
  if(s) answers.freeStrength=s.value.trim();
  if(i) answers.freeImprove=i.value.trim();
  if(t) answers.freeTeacherNote=t.value.trim();
}
function updateNav(){
  const step = steps[current];
  const next = document.getElementById('nextButton');
  next.textContent = current === steps.length - 1 ? '제출하기' : '다음';
  if(step.kind === 'free') next.disabled = false;
  else next.disabled = answers[step.publicId] === undefined;
}
function updateProgress(){
  const answered = Object.keys(answers).filter(k=>k.startsWith('S')||k.startsWith('Q')).length;
  const total = CHECKIN_DATA.preItems.length + CHECKIN_DATA.questions.length;
  document.getElementById('progressLabel').innerText = `${answered} / ${total}`;
  document.getElementById('progressBar').style.width = `${Math.round(answered/total*100)}%`;
}
function prevStep(){
  persistFree();
  if(current > 0){ current--; renderStep(); }
}
function nextStep(){
  if(submitting) return;
  persistFree();
  if(current < steps.length - 1){ current++; renderStep(); return; }
  submitCheckin();
}
function buildPayload(){
  const preAnswers = CHECKIN_DATA.preItems.map(item=>({ publicId:item.publicId, value:answers[item.publicId] }));
  const mainAnswers = CHECKIN_DATA.questions.map(item=>({ publicId:item.publicId, value:answers[item.publicId] }));
  return {
    schemaVersion:'mobile-gas-v1',
    submittedAt:new Date().toISOString(),
    clientSubmissionId:'KLP-MOBILE-' + Date.now() + '-' + Math.random().toString(36).slice(2,8),
    student:{
      name:document.getElementById('studentName').value.trim(),
      grade:document.getElementById('grade').value,
      teacher:document.getElementById('teacherName').value.trim()
    },
    consentChecked:document.getElementById('consent').checked,
    selfWrittenAnswers:{
      strength:answers.freeStrength||'',
      improve:answers.freeImprove||'',
      teacherNote:answers.freeTeacherNote||''
    },
    preAnswers,
    answers:mainAnswers,
    answerTimes
  };
}
async function submitCheckin(){
  const missing = steps.filter(step => step.kind !== 'free' && answers[step.publicId] === undefined);
  if(missing.length){ alert('아직 답하지 않은 문항이 있습니다.'); return; }
  submitting = true;
  document.getElementById('nav').classList.add('hidden');
  document.getElementById('questionCard').innerHTML = '<h2><span class="spinner"></span>제출 중입니다.</h2><p>잠시만 기다려 주세요.</p>';
  try {
    await fetch(GAS_WEB_APP_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(buildPayload())
    });
    showDone();
  } catch(err) {
    showSubmitError();
  }
}
function showDone(){
  document.getElementById('questionCard').classList.add('hidden');
  const done=document.getElementById('doneCard');
  done.className='card done';
  done.innerHTML = `<h2>제출이 완료되었습니다.</h2>
    <p>선생님이 답변을 확인한 뒤, 나에게 맞는 공부 리포트를 정리해줄 예정입니다.</p>
    <p>오늘 답변해줘서 고마워요.</p>`;
  document.getElementById('progressLabel').innerText='제출 완료';
  document.getElementById('progressBar').style.width='100%';
}
function showSubmitError(){
  const done=document.getElementById('doneCard');
  document.getElementById('questionCard').classList.add('hidden');
  done.className='card error';
  done.innerHTML = `<h2>제출 확인이 필요합니다.</h2>
    <p>인터넷 연결이 불안정해서 전송을 확인하지 못했습니다.</p>
    <p>선생님께 이 화면을 보여주세요.</p>
    <button class="primary" onclick="location.reload()">처음부터 다시 시도</button>`;
}
</script>
</body>
</html>
